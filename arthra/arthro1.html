<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Πρόγραμμα - 1ο Λύκειο Μαρκοπούλου </title>
<style>
  :root{
    --gold:#cda85f;
    --gold-dark:#b8934a;
    --gold-darker:#8a6d3b;
    --bg:#f7f3ec;
    --card:#ffffff;
    --border:#efe9df;
    --text:#1e1e1e;
    --muted:#6b6b6b;
    --mon:#fdf6e8;
    --tue:#eef4ea;
    --highlight:#ffe680;
    --highlight-border:#e0b400;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  body{
    background:var(--bg);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    color:var(--text);
    padding:0 0 40px;
    -webkit-text-size-adjust:100%;
  }

  /* ===== SITE HEADER ===== */
  header.site{
    background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
    color:#fff;
    padding:25px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
    margin-bottom:20px;
  }
  header.site h1{font-size:1.7em;letter-spacing:.5px;}

  /* ===== WRAPPER ===== */
  .wrapper{
    max-width:1200px;
    margin:0 auto;
    padding:0 15px;
  }

  a.back{
    display:inline-block;
    margin-bottom:20px;
    color:#2a5298;
    text-decoration:none;
    font-weight:bold;
    font-size:.95em;
    transition:color .2s;
  }
  a.back:hover{color:#f39c12;}

  /* ===== ΑΡΘΡΟ HEADER ===== */
  .art-header{
    text-align:center;
    margin-bottom:22px;
  }
  .art-header .school{
    font-size:12px;font-weight:600;color:#8a7a5c;
    letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;
  }
  .art-header h2{
    font-size:26px;font-weight:800;margin-bottom:4px;color:#1e3c72;
  }
  .art-header .sub{font-size:13px;color:var(--muted);}

  /* ===== ΑΝΑΖΗΤΗΣΗ ===== */
  .search-wrap{max-width:900px;margin:0 auto 12px;position:relative;}
  .search-wrap input{
    width:100%;padding:12px 40px 12px 42px;
    font-size:15px;border:1px solid var(--border);border-radius:12px;
    background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.05);
    font-family:inherit;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(205,168,95,.18);}
  .search-wrap::before{
    content:"🔍";position:absolute;left:14px;top:50%;
    transform:translateY(-50%);font-size:15px;opacity:.55;pointer-events:none;
  }
  .search-wrap .clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border:none;border-radius:50%;
    background:transparent;font-size:16px;color:#999;cursor:pointer;
    display:none;align-items:center;justify-content:center;
  }
  .search-wrap.has-value .clear{display:flex;}
  .search-wrap .clear:hover{background:#f0e8da;color:#555;}

  /* ===== TABS ===== */
  .tabs-row{
    display:flex;gap:6px;max-width:900px;margin:0 auto 10px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;
    scrollbar-width:none;
  }
  .tabs-row::-webkit-scrollbar{display:none;}
  .tabs-row button{
    flex:0 0 auto;padding:9px 14px;
    font-size:13px;font-weight:700;font-family:inherit;
    border:1px solid var(--border);border-radius:10px;
    background:var(--card);color:#5a4a2e;
    cursor:pointer;transition:all .15s;white-space:nowrap;
  }
  .tabs-row button.active{
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
    color:#1f1a12;border-color:var(--gold-darker);
    box-shadow:0 3px 8px rgba(184,147,74,.35);
  }
  .tabs-row button:active{transform:scale(.97);}
  .tabs-row + .tabs-row{margin-top:-4px;}

  /* ===== ΠΙΝΑΚΑΣ ===== */
  .table-wrap{
    display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;
    border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.08);
    background:var(--card);max-width:1200px;margin:0 auto;
    scrollbar-width:thin;scrollbar-color:var(--gold) #f0e8da;
  }
  .table-wrap::-webkit-scrollbar{height:8px;}
  .table-wrap::-webkit-scrollbar-track{background:#f0e8da;border-radius:20px;}
  .table-wrap::-webkit-scrollbar-thumb{background:var(--gold);border-radius:20px;}

  table{border-collapse:collapse;width:100%;min-width:900px;}
  th,td{padding:8px 6px;text-align:center;font-size:13px;border:1px solid var(--border);white-space:nowrap;}
  thead th{
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
    color:#1f1a12;font-weight:800;font-size:12px;text-transform:uppercase;
    position:sticky;top:0;z-index:2;
  }
  thead th.corner{text-align:left;padding-left:14px;z-index:3;left:0;position:sticky;}
  thead th.hour{font-size:12px;background:#d9b56b;}

  tbody th.name{
    background:#f3ede2;color:var(--text);font-weight:700;text-align:left;
    padding-left:14px;position:sticky;left:0;z-index:1;
    min-width:180px;max-width:200px;white-space:normal;word-break:break-word;
    border-right:2px solid #e3d9cc;
  }
  tbody tr.hidden{display:none;}
  tbody tr:hover td{filter:brightness(.96);}
  tbody tr:hover th.name{background:#ede5d6;}

  tbody td[data-day="0"]{background:var(--mon);}
  tbody td[data-day="1"]{background:var(--tue);}
  tbody td[data-day="2"]{background:var(--mon);}
  tbody td[data-day="3"]{background:var(--tue);}
  tbody td[data-day="4"]{background:var(--mon);}

  td.cell{font-weight:700;color:#1f1a12;}
  td.cell.p{background:#e8f0fa !important;color:#2c5d99;}
  td.empty{color:transparent;}
  td.empty::after{content:"·";color:#ddd6c8;font-size:12px;opacity:.6;}

  tbody td.highlight,
  tbody td.cell.highlight,
  tbody td.cell.p.highlight{
    background:var(--highlight) !important;
    color:#1a1a1a !important;
    font-weight:800 !important;
    box-shadow:inset 0 0 0 2px var(--highlight-border);
  }

  body[data-day="0"] table th[data-day]:not([data-day="0"]),
  body[data-day="0"] table td[data-day]:not([data-day="0"]){display:none;}
  body[data-day="1"] table th[data-day]:not([data-day="1"]),
  body[data-day="1"] table td[data-day]:not([data-day="1"]){display:none;}
  body[data-day="2"] table th[data-day]:not([data-day="2"]),
  body[data-day="2"] table td[data-day]:not([data-day="2"]){display:none;}
  body[data-day="3"] table th[data-day]:not([data-day="3"]),
  body[data-day="3"] table td[data-day]:not([data-day="3"]){display:none;}
  body[data-day="4"] table th[data-day]:not([data-day="4"]),
  body[data-day="4"] table td[data-day]:not([data-day="4"]){display:none;}
  body[data-day="all"] table th[data-day],
  body[data-day="all"] table td[data-day]{display:table-cell;}

  body[data-day="0"] table td[data-day="0"]:first-of-type,
  body[data-day="1"] table td[data-day="1"]:first-of-type,
  body[data-day="2"] table td[data-day="2"]:first-of-type,
  body[data-day="3"] table td[data-day="3"]:first-of-type,
  body[data-day="4"] table td[data-day="4"]:first-of-type{
    border-left:1px solid var(--border);
  }

  /* ===== MOBILE ===== */
  .mobile-view{display:none;max-width:900px;margin:0 auto;}
  .teacher-card{
    background:var(--card);border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
    margin-bottom:12px;overflow:hidden;border:1px solid var(--border);
  }
  .teacher-card.hidden{display:none;}
  .teacher-card .card-head{
    background:linear-gradient(135deg,#f3ede2 0%,#ede5d6 100%);
    padding:12px 14px;font-weight:800;font-size:15px;color:#3a2e1a;
    border-bottom:2px solid #e3d9cc;
    display:flex;align-items:center;gap:8px;
  }
  .teacher-card .card-head::before{content:"👤";font-size:14px;opacity:.6;}
  .card-body{padding:10px 12px;}
  .slot{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;border-radius:10px;margin-bottom:6px;
    background:#fdf6e8;font-size:14px;
    border-left:4px solid var(--gold);
    transition:background .15s;
  }
  .slot .hour{font-weight:800;color:#8a6d3b;font-size:13px;min-width:52px;}
  .slot .subject{font-weight:800;color:#1f1a12;font-size:15px;flex:1;text-align:center;}
  .slot.empty-slot{background:#fafaf7;color:#bbb;border-left-color:#e5dfd3;font-style:italic;}
  .slot.empty-slot .subject{color:#bbb;font-weight:500;}
  .slot.p{background:#e8f0fa;border-left-color:#2c5d99;}
  .slot.p .subject{color:#2c5d99;}
  .slot.highlight{
    background:var(--highlight) !important;
    border-left-color:var(--highlight-border) !important;
    box-shadow:0 0 0 2px var(--highlight-border);
  }
  .slot.highlight .subject,.slot.highlight .hour{color:#1a1a1a !important;}

  .day-header{
    font-size:12px;font-weight:800;text-transform:uppercase;
    color:#8a6d3b;letter-spacing:1px;
    padding:8px 4px 4px;border-bottom:1px dashed #e3d9cc;
    margin-bottom:6px;margin-top:6px;
  }
  .day-header:first-child{margin-top:0;}

  .no-results{
    text-align:center;padding:40px 20px;color:#999;font-size:15px;
    background:var(--card);border-radius:14px;border:1px dashed var(--border);
    max-width:900px;margin:0 auto;
  }
  .no-results.hidden{display:none;}

  .active-legend{
    display:none;
    max-width:900px;margin:0 auto 12px;
    text-align:center;font-size:13px;color:#5a4a2e;
    background:#fff8dc;border:1px solid var(--highlight-border);
    border-radius:10px;padding:8px 12px;
    line-height:1.5;
  }
  .active-legend.show{display:block;}
  .active-legend strong{color:#1a1a1a;}
  .active-legend button{
    margin-left:10px;background:transparent;border:1px solid #d4b44a;
    color:#5a4a2e;border-radius:20px;padding:2px 10px;
    font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .active-legend button:hover{background:#f6e9a8;}

  /* ===== FOOTER ===== */
  footer.bottom{
    background:#1e3c72;color:#cfd8e3;text-align:center;
    padding:25px 20px;margin-top:50px;font-size:.9em;
  }
  footer.bottom a{color:#f39c12;text-decoration:none;}

  @media (max-width:820px){
    .table-wrap{display:none;}
    .mobile-view{display:block;}
    .search-wrap input{padding:11px 38px 11px 40px;font-size:16px;}
    header.site h1{font-size:1.4em;}
    .art-header h2{font-size:20px;}
  }
  @media (max-width:480px){
    body{padding:0 0 30px;}
    .wrapper{padding:0 10px;}
    header.site{padding:18px 12px;}
    header.site h1{font-size:1.2em;}
    .art-header h2{font-size:18px;}
    .teacher-card .card-head{font-size:14px;padding:10px 12px;}
    .slot{padding:8px 10px;font-size:13px;flex-wrap:wrap;}
    .slot .subject{font-size:14px;}
    .tabs-row button{padding:8px 12px;font-size:12px;}
  }
</style>
</head>

  ["Κόλλια Αλεξάνδρα", [["","","","","Γ4","Γ3","Γ2"],["Γ2","Γ3","Α1","","Β4","",""],["Γ4","Γ5","Β4","","","",""],["Γ5","Γ2","","Β3","Α1","",""],["","","Β3","","Γ3","Γ4","Γ5"]]],
  ["Σωτηρίου Αικατερίνα", [["ΓΟ1","ΓΟ1","ΓΟ2","ΓΟ2","Α1","",""],["","","","Α2","ΓΟ1","ΓΟ1",""],["Α1","Α3","","","ΓΟ2","ΓΟ2",""],["","","","","Α2","","Α3"],["ΓΟ1","ΓΟ1","ΓΟ2","ΓΟ2","","",""]]],
  ["Τσούτσουρα Αλεξάνδρα", [["Β3","Β4","ΓΟ1","ΓΟ1","","",""],["","","","Β3","ΓΟ2","ΓΟ2",""],["","","ΓΟ2","ΓΟ2","ΓΟ1","ΓΟ1",""],["","","Β2","","ΓΟ1","ΓΟ1","Β4"],["ΓΟ2","ΓΟ2","Β2","","","",""]]],
  ["Κωνσταντοπούλου Μ-Γ ΕΑΕ", [["","p","","p","p","p","p"],["p","p","","p","p","",""],["p","p","p","p","","",""],["p","","p","","p","p","p"],["p","p","p","","p","","p"]]],
  ["Μουρίκη Δήμητρα ΕΑΕ", [["p","p","p","","p","p",""],["","p","p","","p","p",""],["","","","p","","p","p"],["","","","","","",""],["p","p","","p","p","p"]]],
  ["Δαϊκοπούλου Ευαγγελία ΕΑΕ", [["p","p","p","p","p","",""],["p","","p","p","","p",""],["p","p","p","","p","p",""],["","p","p","p","p","","p"],["p","p","","p","",""]]],
  ["Μπιτσάκου Αθανασία ΕΑΕ", [["p","","p","p","","p",""],["p","p","p","","p","p",""],["","","","","","",""],["","","","","","",""],["p","p","","p","","p",""]]],
];

const CLASS_B_DIR = ["ΒΘ1","ΒΘ2","ΒΘ3","ΒΘΕΤ","ΒΑ1","ΒΑ2","ΒΑΝΘΡ"];
const CLASS_G = ["Γ1","Γ2","Γ3","Γ4","Γ5"];
const CLASS_G_DIR = ["ΓΘ","ΓΘΕΤ","ΓΥ","ΓΟ1","ΓΟ2","ΓΑ1","ΓΑ2","ΓΑΝΘΡ"];
const ALL_G = [...CLASS_G, ...CLASS_G_DIR];

const GROUPS = {
  "Α1": ["Α1"], "Α2": ["Α2"], "Α3": ["Α3"], "Α4": ["Α4"],
  "Β1": ["Β1"], "Β2": ["Β2"], "Β3": ["Β3"],
  "Β4": ["Β4", ...CLASS_B_DIR],
  "Γ1": ALL_G, "Γ2": ALL_G, "Γ3": ALL_G, "Γ4": ALL_G, "Γ5": ALL_G,
  "ΓΘ": ALL_G, "ΓΥ": ALL_G, "ΓΟ1": ALL_G, "ΓΟ2": ALL_G,
  "ΓΑ1": ALL_G, "ΓΑ2": ALL_G
};

const SECTION_KEYS = Object.keys(GROUPS);

let currentDay = 'all';
let activeSection = null;

/* ============================================================
   DESKTOP
============================================================ */
function buildDesktopTable(){
  const thead = document.getElementById('tableHead');
  const tbody = document.getElementById('tableBody');

  let headRow1 = `<th rowspan="2" class="corner">ΔΙΔΑΣΚΟΝΤΕΣ</th>`;
  for (let d=0; d<5; d++){
    headRow1 += `<th colspan="7" class="day" data-day="${d}">${DAYS[d].toUpperCase()}</th>`;
  }

  let headRow2 = '';
  for (let d=0; d<5; d++){
    for (let h=1; h<=7; h++){
      headRow2 += `<th class="hour" data-day="${d}">${h}</th>`;
    }
  }

  thead.innerHTML = `<tr>${headRow1}</tr><tr>${headRow2}</tr>`;

  tbody.innerHTML = '';
  data.forEach(([name, days]) => {
    const tr = document.createElement('tr');
    tr.dataset.name = name.toLowerCase();
    let html = `<th class="name">${name}</th>`;
    days.forEach((dayArr, d) => {
      dayArr.forEach(v => {
        if (v === '') {
          html += `<td class="empty" data-day="${d}" data-value=""></td>`;
        } else if (v === 'p') {
          html += `<td class="cell p" data-day="${d}" data-value="p">Π</td>`;
        } else {
          html += `<td class="cell" data-day="${d}" data-value="${v}">${v}</td>`;
        }
      });
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
}

/* ============================================================
   MOBILE
============================================================ */
function buildMobileCards(){
  const wrap = document.getElementById('mobileView');
  wrap.innerHTML = '';

  if (currentDay === 'all'){
    data.forEach(([name, days]) => {
      const card = document.createElement('div');
      card.className = 'teacher-card';
      card.dataset.name = name.toLowerCase();

      let body = '';
      for (let d=0; d<5; d++){
        body += `<div class="day-header">${DAYS[d]}</div>`;
        days[d].forEach((v, i) => {
          const hour = i + 1;
          if (v === '') {
            body += `<div class="slot empty-slot" data-value="" data-day="${d}"><span class="hour">${hour}η</span><span class="subject">—</span></div>`;
          } else if (v === 'p') {
            body += `<div class="slot p" data-value="p" data-day="${d}"><span class="hour">${hour}η</span><span class="subject">Π (ΕΑΕ)</span></div>`;
          } else {
            body += `<div class="slot" data-value="${v}" data-day="${d}"><span class="hour">${hour}η</span><span class="subject">${v}</span></div>`;
          }
        });
      }
      card.innerHTML = `<div class="card-head">${name}</div><div class="card-body">${body}</div>`;
      wrap.appendChild(card);
    });
  } else {
    data.forEach(([name, days]) => {
      const card = document.createElement('div');
      card.className = 'teacher-card';
      card.dataset.name = name.toLowerCase();

      let body = '';
      days[currentDay].forEach((v, i) => {
        const hour = i + 1;
        if (v === '') {
          body += `<div class="slot empty-slot" data-value=""><span class="hour">${hour}η</span><span class="subject">—</span></div>`;
        } else if (v === 'p') {
          body += `<div class="slot p" data-value="p"><span class="hour">${hour}η</span><span class="subject">Π (ΕΑΕ)</span></div>`;
        } else {
          body += `<div class="slot" data-value="${v}"><span class="hour">${hour}η</span><span class="subject">${v}</span></div>`;
        }
      });
      card.innerHTML = `<div class="card-head">${name}</div><div class="card-body">${body}</div>`;
      wrap.appendChild(card);
    });
  }
}

/* ============================================================
   HIGHLIGHT
============================================================ */
function applyHighlight(){
  document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));

  if (!activeSection){
    document.getElementById('activeLegend').classList.remove('show');
    return;
  }

  const targets = GROUPS[activeSection] || [activeSection];
  const targetsUpper = targets.map(t => t.toUpperCase());

  document.querySelectorAll('#tableBody td[data-value]').forEach(td => {
    const v = (td.dataset.value || '').toUpperCase();
    if (v && targetsUpper.includes(v)) td.classList.add('highlight');
  });

  document.querySelectorAll('#mobileView .slot[data-value]').forEach(slot => {
    const v = (slot.dataset.value || '').toUpperCase();
    if (v && targetsUpper.includes(v)) slot.classList.add('highlight');
  });

  const legend = document.getElementById('activeLegend');
  legend.classList.add('show');

  const firstChar = activeSection[0];
  let labelText;
  if (activeSection === 'Β4'){
    labelText = `Β4 + κατευθύνσεις Β' (${CLASS_B_DIR.join(', ')})`;
  } else if (firstChar === 'Γ'){
    labelText = `όλη η Γ' τάξη (${ALL_G.join(', ')})`;
  } else {
    labelText = activeSection;
  }
  document.getElementById('activeLabel').textContent = labelText;
}

/* ============================================================
   SECTION TABS
============================================================ */
function buildSectionTabs(){
  const wrap = document.getElementById('sectionTabs');
  wrap.innerHTML = '';
  SECTION_KEYS.forEach(s => {
    const b = document.createElement('button');
    b.textContent = s;
    b.dataset.section = s;
    b.addEventListener('click', () => {
      if (activeSection === s){
        activeSection = null;
        document.querySelectorAll('#sectionTabs button').forEach(x => x.classList.remove('active'));
      } else {
        activeSection = s;
        document.querySelectorAll('#sectionTabs button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      }
      applyHighlight();
    });
    wrap.appendChild(b);
  });
}

/* ============================================================
   SEARCH
============================================================ */
const searchInput = document.getElementById('searchInput');
const searchWrap = document.getElementById('searchWrap');
const clearBtn = document.getElementById('clearBtn');
const noResults = document.getElementById('noResults');

function applySearch(){
  const q = searchInput.value.trim().toLowerCase();
  searchWrap.classList.toggle('has-value', q.length > 0);

  let visibleDesktop = 0;
  document.querySelectorAll('#tableBody tr').forEach(tr => {
    const match = tr.dataset.name.includes(q);
    tr.classList.toggle('hidden', !match);
    if (match) visibleDesktop++;
  });

  let visibleMobile = 0;
  document.querySelectorAll('.teacher-card').forEach(card => {
    const match = card.dataset.name.includes(q);
    card.classList.toggle('hidden', !match);
    if (match) visibleMobile++;
  });

  const isMobile = window.matchMedia('(max-width:820px)').matches;
  const visible = isMobile ? visibleMobile : visibleDesktop;
  noResults.classList.toggle('hidden', visible > 0);
}

searchInput.addEventListener('input', applySearch);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  applySearch();
  searchInput.focus();
});

/* ============================================================
   DAY TABS
============================================================ */
document.querySelectorAll('#dayTabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#dayTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const val = btn.dataset.day;
    currentDay = (val === 'all') ? 'all' : parseInt(val, 10);
    document.body.dataset.day = (val === 'all') ? 'all' : val;

    buildMobileCards();
    applyHighlight();
    applySearch();
  });
});

/* ============================================================
   CLEAR
============================================================ */
document.getElementById('clearHighlight').addEventListener('click', () => {
  activeSection = null;
  document.querySelectorAll('#sectionTabs button').forEach(x => x.classList.remove('active'));
  applyHighlight();
});

/* ============================================================
   INIT
============================================================ */
function init(){
  buildSectionTabs();
  buildDesktopTable();
  buildMobileCards();
  applyHighlight();
  applySearch();
}

let lastIsMobile = window.matchMedia('(max-width:820px)').matches;
window.addEventListener('resize', () => {
  const isMobile = window.matchMedia('(max-width:820px)').matches;
  if (isMobile !== lastIsMobile){
    lastIsMobile = isMobile;
    applySearch();
  }
});

init();
</script>
